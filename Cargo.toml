[package]
name = "market-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
encoding_rs = "0.8"
jiff = { version = "1.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
