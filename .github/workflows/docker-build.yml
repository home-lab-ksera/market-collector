# GitHub Actions workflow for market-collector
# GitHub-hosted runner + Tailscale OIDC - latest運用

name: Build and Push to Harbor - market-collector

on:
  # 手動実行はテストとビルドのみ。公開は main への push で実行する。
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # fmt・clippy・cargo-audit。rust-toolchain.toml の版で実行し、指摘があれば publish しない。
  verify:
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/rust-verify.yml@main

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: market_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -- --include-ignored --test-threads=1
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/market_test

  publish:
    needs: [verify, database-tests]
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/publish-harbor.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      image_name: market-collector
      test_target: test
